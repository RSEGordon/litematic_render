<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投影渲染</title><style>
:root{--ink:#33424a;--muted:#7c898f;--line:#dfe5e5;--paper:#f5f4ef;--card:#fff;--blue:#7896a5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif}.wrap{max-width:1080px;margin:auto;padding:36px 20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.back{color:var(--muted);text-decoration:none}.panel,.task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 5px 18px #3342  }.upload{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.upload input{flex:1;min-width:230px;padding:12px;border:1px dashed #aebbbc;border-radius:9px}.btn{border:0;border-radius:9px;background:var(--blue);color:white;padding:12px 18px;cursor:pointer}.list{display:grid;gap:12px}.task{display:grid;grid-template-columns:1fr auto;align-items:center;text-decoration:none;color:inherit}.task small{color:var(--muted)}.status{padding:5px 10px;border-radius:99px;background:#eef3f4;font-size:12px}.complete{background:#e4f2e8;color:#39704a}.failed{background:#f8e6e4;color:#9b4c42}@media(max-width:600px){.wrap{padding:20px 12px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><div><a class="back" href="/tools">← 妙妙小工具</a><h1>🧱 投影渲染</h1><p>上传后同时生成彩图、蓝图和备货清单。</p></div></div><section class="panel"><form class="upload" action="/tools/litematic_render/upload" method="post" enctype="multipart/form-data"><input name="litematic" type="file" accept=".litematic" required><button class="btn">上传并开始</button></form></section><h2>投影任务</h2><div class="list">{% for task in tasks %}<a class="task" href="/tools/litematic_render/{{task.id}}/"><div><strong>{{task.filename}}</strong><br><small>{{"%.2f"|format(task.size/1048576)}} MB · {{task.id}}</small></div><span class="status {{task.status}}">{{task.status}}</span></a>{% else %}<section class="panel">还没有任务，先上传一个投影。</section>{% endfor %}</div></main></body></html>
