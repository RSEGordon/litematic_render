<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>{{(metadata.name if metadata and metadata.name else '投影渲染')}} · 工具 · Hermes</title>
    <link rel="icon" href="/favicon.png">
    <link rel="stylesheet" href="/css/morandi">
    <style>
        .container{max-width:980px;margin:20px auto;background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
        .header{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:14px;gap:12px;flex-wrap:wrap}
        .header h1{font-size:15px;font-weight:700;margin:0}
        .header-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
        .header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
        .back-arrow{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);text-decoration:none;flex-shrink:0;transition:background .15s,border-color .15s,color .15s}
        .back-arrow:hover{background:var(--user-bubble);border-color:var(--accent);color:var(--accent)}

        .input-form{background:linear-gradient(135deg,var(--card) 0%,var(--bg) 100%);border:2px dashed var(--border);border-radius:14px;padding:32px 24px;margin-bottom:14px;text-align:center;transition:all .2s}
        .input-form:hover{border-color:var(--blue);background:linear-gradient(135deg,var(--bg) 0%,rgba(139,165,181,.06) 100%)}
        .input-form.dragging{border-color:var(--blue);border-style:solid;background:rgba(139,165,181,.08);transform:scale(1.01)}
        .input-form .upload-icon{font-size:42px;margin-bottom:10px;display:block;opacity:.55;line-height:1}
        .input-form .upload-title{font-size:16px;color:var(--text);margin:0 0 6px;font-weight:600}
        .input-form .upload-subtitle{font-size:12px;color:var(--muted);margin:0 0 18px}
        .input-form .file-input{display:none}
        .input-form .file-pick{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;background:var(--card);color:var(--text);border:1px solid var(--border);transition:all .15s}
        .input-form .file-pick:hover{border-color:var(--blue);color:var(--blue);background:var(--bg)}
        .input-form .file-pick svg{flex-shrink:0}
        .input-form .file-name{display:block;margin:14px auto 0;font-size:12px;color:var(--muted);min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80%}
        .input-form .file-name.has-file{color:var(--blue);font-weight:600}
        .input-form .upload-submit{margin-top:16px;border:0;border-radius:10px;padding:11px 28px;font-size:14px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;white-space:nowrap;transition:all .15s;display:none}
        .input-form .upload-submit:hover{background:#7B95A5;transform:translateY(-1px);box-shadow:0 4px 12px rgba(139,165,181,.25)}
        .input-form .upload-submit.show{display:inline-flex;align-items:center;gap:6px}
        .input-form .upload-submit svg{flex-shrink:0}
        .upload-error{display:none;margin:14px 0 0;padding:10px 14px;border-radius:8px;background:#F4E4E2;color:#8A5550;font-size:13px}
        .upload-error.show{display:block}

        .history-section{background:var(--bg);border-radius:10px;padding:14px 16px}
        .history-section h2{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:600}
        .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
        .task{position:relative;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:.2s}
        .task:hover{border-color:var(--blue);box-shadow:0 3px 10px rgba(139,165,181,.15)}
        .task{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:all .2s;position:relative}
        .task:hover{border-color:var(--blue);box-shadow:0 3px 10px rgba(139,165,181,.15)}
        .task .cover-link{display:block;color:inherit;text-decoration:none}
        .task .cover-frame{margin:10px 10px 0;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,var(--border),var(--bg))}
        .task .cover-wrap{position:relative;aspect-ratio:4/3;overflow:hidden;border:1px solid var(--border);border-radius:7px}
        .task .cover{width:88%;height:88%;object-fit:contain;display:block;margin:6% auto;transition:transform .3s}
        .task:hover .cover{transform:scale(1.04)}
        .task .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:8px}
        .task .has-cover .placeholder{display:none}
        .task .delete{position:absolute;right:7px;top:7px;z-index:3;width:27px;height:27px;border:0;border-radius:50%;background:rgba(0,0,0,.58);color:#fff;font-size:18px;cursor:pointer;opacity:0;line-height:1}
        .task:hover .delete,.delete:focus{opacity:1}
        .task .body{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:6px;min-height:90px}
        .task .title{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .task .meta{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px}
        .task .meta .meta-size{color:var(--blue);font-weight:600}
        .task .meta .meta-author::before{content:"👤";font-size:10px;margin-right:3px}
        .task .progress-text{font-size:10px;color:var(--muted)}
        .task .footer{padding:8px 12px 10px;border-top:1px solid var(--border);display:flex;justify-content:flex-start;align-items:center;gap:8px;font-size:10px;background:var(--bg);position:relative;min-height:42px;box-sizing:border-box}
        .task .footer .state,.task .footer time{flex:0 0 auto}
        .task .footer .open{margin-left:auto}
        .task.rendering .footer::before,.task.queued .footer::before{content:"";position:absolute;left:0;top:-1px;width:var(--p,0%);height:3px;background:linear-gradient(90deg,var(--blue),#00a1d6);transition:width .4s;z-index:2}
        .task .state{padding:2px 8px;border-radius:8px;font-weight:600;font-size:10px;line-height:1.2;display:inline-flex;align-items:center}
        .task .state.complete{background:#E8F0E6;color:#5A7A55}
        .task .state.queued,.task .state.rendering{background:#FAF3DC;color:#8A7A55}
        .task .state.failed{background:#F4E4E2;color:#8A5550}
        .task .footer .open{color:var(--blue);text-decoration:none;font-weight:600;font-size:11px}
        .task .retry{padding:5px 9px;background:var(--accent);color:#fff;border:0;border-radius:6px;font-size:11px;cursor:pointer}
        .empty{text-align:center;padding:48px 32px;color:var(--muted);font-size:13px;grid-column:1/-1;background:var(--card);border-radius:10px;border:1px dashed var(--border)}
        .empty .empty-icon{font-size:38px;display:block;margin-bottom:10px;opacity:.45;line-height:1}
        .empty .empty-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
        .empty .empty-sub{font-size:11px;color:var(--muted)}
        .pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:18px;flex-wrap:wrap}
        .pagination button{min-width:32px;height:32px;padding:0 10px;border:1px solid var(--border);background:var(--card);border-radius:6px;font-size:12px;color:var(--text);cursor:pointer;transition:all .15s}
        .pagination button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
        .pagination button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
        .pagination button:disabled{opacity:.4;cursor:not-allowed}
        .pagination .page-ellipsis{color:var(--muted);padding:0 4px}
        .pagination .page-input{width:48px;height:32px;border:1px solid var(--border);background:var(--card);border-radius:6px;text-align:center;font-size:12px}

        @media(max-width:720px){.container{margin:8px;border-radius:10px;padding:14px}.input-form{padding:24px 16px}.upload-submit{width:100%}}
    </style>
</head>
<body>
    {{ nav|safe }}
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>🧱 投影渲染与备货</h1>
            </div>
            <div class="header-right">
                <a href="/tools" class="back-arrow" title="返回工具" aria-label="返回工具">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                </a>
            </div>
        </div>

        <form class="input-form" action="/tools/litematic_render/upload" method="post" enctype="multipart/form-data" id="upload-form">
            <span class="upload-icon">📦</span>
            <p class="upload-title">上传 Litematica 投影</p>
            <p class="upload-subtitle">支持 .litematic 文件 · 拖拽到此处或点击下方按钮</p>
            <input class="file-input" name="litematic" type="file" accept=".litematic" id="litematic-input" required>
            <label class="file-pick" for="litematic-input">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                选择文件
            </label>
            <span class="file-name" id="file-name">未选择任何文件</span>
            <button class="upload-submit" type="submit" id="upload-submit">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                开始渲染
            </button>
            <div class="upload-error" id="upload-error" role="alert" aria-live="polite"></div>
        </form>

        <div class="history-section">
            <h2>📚 最近任务</h2>
            <div id="card-grid" class="card-grid"></div>
            <div class="pagination" id="pagination"></div>
            <script id="tasks-data" type="application/json">{{ tasks|tojson }}</script>
        </div>
    </div>

    <script>
    // V131: 从 bili_summary 抄的分页 + 客户端渲染 — 每页5行, 按屏幕宽度算每行卡片数
    const ROWS_PER_PAGE = 5;
    const STATE_LABELS = {queued:'排队中',rendering:'渲染中',complete:'已完成',failed:'失败'};
    let allTasks = [];
    let currentPage = 1;

    function cardsPerRow(){
      const w = window.innerWidth;
      if(w <= 720) return 1;
      const containerW = Math.min(980, w) - 40;
      return Math.max(1, Math.floor((containerW + 12) / (260 + 12)));
    }
    function pagesCount(){
      const per = cardsPerRow() * ROWS_PER_PAGE;
      return Math.max(1, Math.ceil(allTasks.length / per));
    }

    function escapeHtml(s){
      return (s||'').replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderCard(task){
      var hasThumb = !!(task.outputs && task.outputs.thumbnail);
      var state = task.status || 'rendering';
      var stateText = STATE_LABELS[state] || state;
      var meta = task.metadata || {};
      var sizeStr = task.size ? filesizeFormat(task.size) : '';
      var author = (meta && meta.author && meta.author !== '—') ? meta.author : '';
      var metaHtml = '';
      if(sizeStr) metaHtml += '<span class="meta-size">'+escapeHtml(sizeStr)+'</span>';
      if(author) metaHtml += '<span class="meta-author">'+escapeHtml(author)+'</span>';
      var coverHtml = hasThumb
        ? '<img class="cover" src="/tools/litematic_render/'+task.id+'/download/thumbnail" alt="'+escapeHtml(task.filename)+' 彩图正交视图" loading="lazy">'
        : '';
      var placeholder = state==='queued'||state==='rendering'
        ? '彩图正交视图生成中' : '暂无彩图正交视图';
      var progressText = state==='queued'||state==='rendering'
        ? '<div class="progress-text">进度 '+(task.progress||0)+'%</div>' : '';
      var footerActions = '';
      if(state==='failed') footerActions = '<button class="retry" type="button">重试</button>';
      if(state==='complete') footerActions = '<a class="open" href="/tools/litematic_render/'+task.id+'/">查看 ›</a>';
      var finishedTime = task.finished_at || task.created_at || 0;
      var timeStr = '';
      if(finishedTime){
        var d = new Date(Number(finishedTime)*1000);
        timeStr = d.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
      }
      return '<article class="task '+state+'" data-id="'+task.id+'" style="--p:'+(task.progress||0)+'%">'+
        '<button class="delete" type="button" aria-label="删除任务">×</button>'+
        '<a class="cover-link" href="/tools/litematic_render/'+task.id+'/">'+
          '<div class="cover-frame"><div class="cover-wrap'+(hasThumb?' has-cover':'')+'">'+
            coverHtml+
            '<div class="placeholder">'+placeholder+'</div>'+
          '</div></div>'+
          '<div class="body">'+
            '<div class="title">'+escapeHtml(task.filename)+'</div>'+
            '<div class="meta">'+metaHtml+'</div>'+
            progressText+
          '</div>'+
        '</a>'+
        '<div class="footer">'+
          '<span class="state '+state+'">'+stateText+'</span>'+
          '<time>'+timeStr+'</time>'+
          footerActions+
        '</div>'+
      '</article>';
    }

    function filesizeFormat(bytes){
      if(bytes < 1024) return bytes+' B';
      if(bytes < 1048576) return (bytes/1024).toFixed(1)+' kB';
      if(bytes < 1073741824) return (bytes/1048576).toFixed(2)+' MB';
      return (bytes/1073741824).toFixed(2)+' GB';
    }

    function renderPagination(){
      const total = pagesCount();
      const paginationEl = document.getElementById('pagination');
      if(total <= 1){paginationEl.innerHTML='';return;}
      const cur = currentPage;
      const showPages = new Set([1,2,total-1,total,cur].filter(p => p>=1 && p<=total));
      if(cur-1 >= 1) showPages.add(cur-1);
      if(cur+1 <= total) showPages.add(cur+1);
      const sorted = [...showPages].sort((a,b) => a-b);
      let html = '<button '+(cur===1?'disabled':'')+' data-page="'+(cur-1)+'">‹</button>';
      let prev = 0;
      for(const p of sorted){
        if(p - prev > 1){
          html += '<span class="page-ellipsis">…</span>';
          html += '<input class="page-input" type="number" min="1" max="'+total+'" placeholder="'+(p-1)+'">';
          html += '<span class="page-ellipsis">…</span>';
        }
        html += '<button class="'+(p===cur?'active':'')+'" data-page="'+p+'">'+p+'</button>';
        prev = p;
      }
      html += '<button '+(cur===total?'disabled':'')+' data-page="'+(cur+1)+'">›</button>';
      paginationEl.innerHTML = html;
      paginationEl.querySelectorAll('button[data-page]').forEach(function(btn){
        if(btn.disabled) return;
        btn.addEventListener('click', function(){goPage(Number(btn.dataset.page));});
      });
      paginationEl.querySelectorAll('.page-input').forEach(function(input){
        input.addEventListener('change', function(){
          var v = Number(input.value);
          if(v>=1 && v<=pagesCount()) goPage(v);
        });
      });
    }

    function goPage(p){
      var total = pagesCount();
      if(p < 1 || p > total) return;
      currentPage = p;
      renderPagination();
      renderCurrentPage();
    }

    function renderCurrentPage(){
      const cardGrid = document.getElementById('card-grid');
      var per = cardsPerRow() * ROWS_PER_PAGE;
      var start = (currentPage-1) * per;
      var slice = allTasks.slice(start, start + per);
      if(slice.length === 0){
        cardGrid.innerHTML = '<div class="empty">'+
          '<span class="empty-icon">📭</span>'+
          '<div class="empty-title">还没有任务</div>'+
          '<div class="empty-sub">先上传一个 Litematica 投影吧</div>'+
        '</div>';
        return;
      }
      cardGrid.innerHTML = slice.map(renderCard).join('');
    }

    // 初始化
    try{
      allTasks = JSON.parse(document.getElementById('tasks-data').textContent || '[]');
    }catch(e){allTasks = [];}

    renderPagination();
    renderCurrentPage();

    // 删除 / 重试 处理 (事件委托)
    document.addEventListener('click',async function(e){
      var card = e.target.closest('.task');
      if(!card) return;
      var id = card.dataset.id;
      if(e.target.closest('.retry')){
        e.preventDefault();
        var r = await fetch('/api/tools/litematic_render/'+id+'/retry',{method:'POST'});
        if(r.ok) location.reload(); else alert((await r.json()).error||'重试失败');
        return;
      }
      if(e.target.closest('.delete')){
        e.preventDefault();
        if(!confirm('确定删除这个任务？')) return;
        var r = await fetch('/api/tools/litematic_render/'+id,{method:'DELETE'});
        if(r.ok){ card.remove(); }
        else alert((await r.json()).error||'删除失败');
      }
    });

    // V128/V131: AJAX 轮询 — 进度更新 + 渲染完成刷新
    function pollTasks(){
      var inProgress = allTasks.filter(function(t){return t.status==='rendering'||t.status==='queued';});
      if(inProgress.length === 0) return;
      Promise.all(inProgress.map(function(t){
        return fetch('/tools/litematic_render/'+t.id+'/status',{cache:'no-store'})
          .then(function(r){return r.ok?r.json():null}).catch(function(){return null;});
      })).then(function(results){
        var changed = false;
        results.forEach(function(state){
          if(!state) return;
          var idx = allTasks.findIndex(function(t){return t.id===state.id;});
          if(idx >= 0){
            allTasks[idx].status = state.status;
            allTasks[idx].outputs = state.outputs || allTasks[idx].outputs;
            allTasks[idx].progress = state.progress;
            allTasks[idx].finished_at = state.finished_at || allTasks[idx].finished_at;
            changed = true;
          }
          if(state.status==='complete' || state.status==='failed'){
            // 任务完成 — 刷一次整页看产物
            setTimeout(function(){location.reload();}, 800);
          }
        });
        if(changed){
          renderPagination();
          renderCurrentPage();
        }
        setTimeout(pollTasks, 2000);
      }).catch(function(){setTimeout(pollTasks, 3000);});
    }
    setTimeout(pollTasks, 1500);

    // 窗口 resize 重新算分页
    var resizeTimer;
    window.addEventListener('resize', function(){
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function(){
        var newTotal = pagesCount();
        if(currentPage > newTotal) currentPage = newTotal;
        renderPagination();
        renderCurrentPage();
      }, 200);
    });

    // 文件上传 (拖拽 + 提交)
    (function(){
      var form=document.getElementById('upload-form');
      var input=document.getElementById('litematic-input');
      var fileName=document.getElementById('file-name');
      var submitBtn=document.getElementById('upload-submit');
      var uploadError=document.getElementById('upload-error');
      if(!form||!input) return;
      function update(file){
        if(file){ fileName.textContent=file.name; fileName.classList.add('has-file'); submitBtn.classList.add('show'); }
        else { fileName.textContent='未选择任何文件'; fileName.classList.remove('has-file'); submitBtn.classList.remove('show'); }
      }
      input.addEventListener('change',function(){update(input.files[0])});
      form.addEventListener('submit',async function(e){
        e.preventDefault();
        uploadError.classList.remove('show');
        submitBtn.disabled=true;
        try{
          var response=await fetch(form.action,{method:'POST',body:new FormData(form)});
          if(response.ok){
            // V130: 上传成功后刷新当前页 — 新 task 卡片显示出来
            location.reload();
            return;
          }
          var result=await response.json().catch(function(){return {}});
          uploadError.textContent=result.error||'上传失败，请稍后重试';
          uploadError.classList.add('show');
        }catch(error){
          uploadError.textContent='上传失败，请检查网络后重试';
          uploadError.classList.add('show');
        }finally{
          submitBtn.disabled=false;
        }
      });
      ['dragenter','dragover'].forEach(function(evt){
        form.addEventListener(evt,function(e){e.preventDefault();e.stopPropagation();form.classList.add('dragging')});
      });
      ['dragleave','drop'].forEach(function(evt){
        form.addEventListener(evt,function(e){e.preventDefault();e.stopPropagation();form.classList.remove('dragging')});
      });
      form.addEventListener('drop',function(e){
        var files=e.dataTransfer.files;
        if(files&&files.length){
          input.files=files;
          update(files[0]);
        }
      });
    })();
    </script>
</body>
</html>
